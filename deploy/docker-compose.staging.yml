# STAGING stack (configuration only; nothing here deploys anything). Runbook: deploy/README-staging.md.
#
#   docker compose --env-file <SF_STAGING_COMPOSE_ENV> -f deploy/docker-compose.staging.yml config -q
#   docker compose --env-file <SF_STAGING_COMPOSE_ENV> -f deploy/docker-compose.staging.yml up -d
#
# Rules this file encodes (OPS-1/2/3, DATA-1/2, STACK-2/6, SNK-3, P-15):
# - No secret and no customer value is written here. Non-secret, per-installation values are interpolated
#   from the compose env file; secrets live in per-role env files OUTSIDE the repository, under
#   ${SF_SECRETS_DIR} (examples with placeholders: deploy/staging/*.env.example).
# - Images are pinned by explicit reference (tag or digest), no `latest` default. Initial path: built ON the
#   VPS from a checked-out git tag/commit (`docker compose build`; the tags carry the SHA, see README-staging.md
#   "Build and deploy"); a registry reference works unchanged if one is adopted later (OPS-3 PROPOSED).
# - Start-up order: [postgres, profile self-hosted-db = the default initial staging database] -> one-time
#   `db-roles` bootstrap by the owner (profile ops-admin) -> migrate (one-shot) -> api + worker (+ verifier)
#   -> web -> edge. Processes never migrate on start (DATA-2).
# - Database roles (least privilege): migrate = force_migrator (migrate.env), api = force_api (api.env),
#   worker = force_worker (worker.env), backup and restore-check (live side) = force_backup (backup.env, read-only).
#   Each service gets ONLY its own DATABASE_URL. The PostgreSQL superuser
#   (postgres.env / db-admin.env) is used by no application service: only by the postgres container itself
#   and by the owner's one-time `db-roles` job.
# - Staging behaves like production: NODE_ENV=production on every server container, local login for admin and technical only
#   (API_AUTH_MODE=local / WEB_AUTH_MODE=local), operational login off, no demo accounts, no seed. The API
#   refuses dev authentication and demo accounts and requires TRUST_PROXY / ALLOWED_ORIGINS / dataset
#   identity; the worker refuses the fake gateway unless ALLOW_FAKE_GATEWAY=1 is explicit.
# - `verifier`: the dedicated internal identity verifier (STACK-2 option C, owner decision 2026-10-02).
#   STRUCTURE ONLY: VERIFIER_MODE=disabled (the real Sankhya adapter is blocked), uniform denial. Internal-only
#   network (`verifier`, internal: true: no published port, not on `edge`, no outbound traffic), reachable by
#   the API alone. It has its own secret file (verifier.env) and no database or Sankhya settings; the API holds
#   no Sankhya credentials; the worker receives none of the verifier secrets and never sees user passwords.
# - Sankhya settings for sync exist ONLY in the worker env file (STACK-2). Staging never reaches Sankhya
#   production (SNK-3): the gateway itself refuses SANKHYA_ENVIRONMENT=production.
# - No seed, no demo accounts: docker-compose.seed.yml is never combined with this file.
name: salesforce-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

# Every container drops ALL capabilities and cannot gain privileges. Exceptions are explicit: edge adds back only
# NET_BIND_SERVICE; postgres (the database container) keeps the capabilities its entrypoint needs to chown the data
# directory and drop to the postgres user.
# Ops containers (backup, restore-check, db-roles, offsite) run as SF_OPS_USER (uid:gid of the deploy user, set in
# compose.env): without CAP_DAC_OVERRIDE a root process cannot read or write files owned by someone else, so they
# run as the owner of SF_BACKUP_DIR and of the checked-out scripts instead of as root.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-server: &server
  image: ${SERVER_IMAGE:?SERVER_IMAGE must be an explicit pinned image reference (tag or digest)}
  # Used only by `docker compose build` on the VPS; the tag in SERVER_IMAGE carries the git SHA.
  build:
    context: ..
    dockerfile: deploy/Dockerfile.server
  logging: *logging
  <<: *hardening
  read_only: true
  tmpfs:
    - /tmp

# One-shot migration job, shared by `migrate` (deploy path) and `migrate-safe` (ops: dump first).
x-migrate: &migrate
  <<: *server
  restart: "no"
  env_file:
    - ${SF_SECRETS_DIR:?SF_SECRETS_DIR must point outside the repository}/migrate.env
  environment:
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
  networks: [backend]
  command:
    - sh
    - -c
    - node node_modules/@salesforce/db/dist/migrate/cli.js && node dist/queue-install.js

services:
  # DEFAULT initial staging database (owner decision): PostgreSQL isolated on the same VPS, started with
  # `--profile self-hosted-db`. Managed PostgreSQL >= 16 (same major as production, DATA-1) remains the target
  # (V-04, V-15) and needs no container: omit the profile and point DATABASE_URL at it. This container has no
  # WAL archiving and no PITR: its recovery point is the last logical dump, so RPO <= 15 min is NOT met
  # (README-staging.md "Backup and restore"). Never a production pattern. No published port: only `backend`.
  postgres:
    profiles: ["self-hosted-db"]
    image: postgres:${PG_MAJOR:?PG_MAJOR must match production (DATA-1, V-15)}
    restart: unless-stopped
    logging: *logging
    env_file:
      - ${SF_SECRETS_DIR:?SF_SECRETS_DIR must point outside the repository}/postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot: reviewed SQL migrations (advisory-lock protected, DATA-2), then the pg-boss schema and queues.
  # Idempotent. api and worker wait for it to complete successfully; a failure stops the rollout.
  # The self-hosted postgres dependency is optional so a managed database needs no container.
  # Runs as force_migrator (migrate.env), the only role that may change the schema.
  migrate:
    <<: *migrate
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  api:
    <<: *server
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      # DATABASE_URL (force_api) and API-only settings. No Sankhya setting, no verifier-side secret.
      - ${SF_SECRETS_DIR}/api.env
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      # Explicit, no default. Staging value: `local` (admin and technical Argon2id login; operational login stays off).
      # `dev` is refused by the API in production.
      AUTH_MODE: ${API_AUTH_MODE:?API_AUTH_MODE must be set explicitly}
      # The browser origin is the public staging host (TLS terminated by the edge).
      ALLOWED_ORIGINS: https://${STAGING_DOMAIN:?STAGING_DOMAIN is required}
      # Exactly one trusted hop: the edge (Caddy) proxies /api/* straight to the API and sets the client address.
      TRUST_PROXY: "1"
      # Dataset identity of THIS staging installation (non-secret; never the production identity).
      SF_ERP_ENVIRONMENT: ${SF_ERP_ENVIRONMENT:?SF_ERP_ENVIRONMENT is required in production mode}
      SF_DATASET_ID: ${SF_DATASET_ID:?SF_DATASET_ID is required in production mode}
      # No SF_ALLOW_DEMO_ACCOUNTS and no ALLOW_DEV_AUTH: staging has no demo data and no dev authentication.
      # No SANKHYA_*: the API never reads Sankhya settings (STACK-2/3).
      # Directory (Sankhya user) login through the internal verifier (AUTH-5). OFF unless compose.env sets it to 1;
      # when on, the shared secret comes from api.env (same value as in verifier.env) and the API refuses to boot without it.
      EXTERNAL_LOGIN_ENABLED: ${EXTERNAL_LOGIN_ENABLED:-0}
      # Seller accounts created/reconciled from the official ERP user -> seller relation at login (CFG-2). OFF unless compose.env says 1.
      EXTERNAL_AUTO_PROVISION: ${EXTERNAL_AUTO_PROVISION:-0}
      EXTERNAL_IDUSU_IS_CODUSU_VALIDATED: ${EXTERNAL_IDUSU_IS_CODUSU_VALIDATED:-0}
      EXTERNAL_DIRECTORY_MAX_AGE_MINUTES: ${EXTERNAL_DIRECTORY_MAX_AGE_MINUTES:-120}
      VERIFIER_URL: http://verifier:3002
      # Product photos: read-only view of the volume the worker fills (INTERIM filesystem store, V-05/STACK-7).
      PRODUCT_MEDIA_DIR: /var/lib/sales-force/product-media
      PRODUCT_MEDIA_MAX_BYTES: ${PRODUCT_MEDIA_MAX_BYTES:-5242880}
      # Largest GENERATED thumbnail served (the worker renders every photo's own 256 px WebP, bounded at 256 KiB).
      PRODUCT_MEDIA_THUMB_MAX_BYTES: ${PRODUCT_MEDIA_THUMB_MAX_BYTES:-262144}
    volumes:
      - product_media:/var/lib/sales-force/product-media:ro
    command: ["node", "dist/main-api.js"]
    # `verifier`: the API is the only caller of the internal identity verifier.
    networks: [backend, edge, verifier]
    healthcheck:
      # Liveness. Readiness (database, migrations, integration) is GET /api/v1/ready (503 when not_ready),
      # polled by the external monitor and by the rollout checks in the runbook, not by the container.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 6

  worker:
    <<: *server
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      # DATABASE_URL (force_worker) and the Sankhya settings. Not on the `verifier` network, no verifier secret.
      - ${SF_SECRETS_DIR}/worker.env
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_HEALTH_HOST: 127.0.0.1
      WORKER_HEALTH_PORT: "3001"
      # SNK-3: `fake` by default; `live` only against a non-production Sankhya, with credentials in worker.env
      # (SANKHYA_ENVIRONMENT sandbox|homologation; production is refused by the gateway). Production mode
      # requires the explicit fake opt-in below, which is only meaningful while SANKHYA_MODE=fake.
      # Both come from compose.env (fake + ALLOW_FAKE_GATEWAY=1 in the example): no implicit fake gateway.
      SANKHYA_MODE: ${SANKHYA_MODE:?SANKHYA_MODE must be set explicitly (fake or live)}
      ALLOW_FAKE_GATEWAY: ${ALLOW_FAKE_GATEWAY:-}
      # Mandatory and explicit in live mode (scheduled mirror never starts against a real Sankhya by default).
      SYNC_MIRROR_ENABLED: ${SYNC_MIRROR_ENABLED:-}
      # Login directory only: keeps `sellers` + `directoryUsers` fresh (read-only, enqueued once at startup, then on the cron) for the
      # Sankhya-only login. Independent of SYNC_MIRROR_ENABLED and never enables customers, products, prices or media.
      AUTH_DIRECTORY_SYNC_ENABLED: ${AUTH_DIRECTORY_SYNC_ENABLED:-0}
      AUTH_DIRECTORY_SYNC_CRON: ${AUTH_DIRECTORY_SYNC_CRON:-*/15 * * * *}
      # Product photos (ERP -> persistent volume). OFF by default: nothing is registered or scheduled until the
      # owner enables it. The directory is the only writable path of the worker besides /tmp.
      PRODUCT_MEDIA_SYNC_ENABLED: ${PRODUCT_MEDIA_SYNC_ENABLED:-false}
      PRODUCT_MEDIA_DIR: /var/lib/sales-force/product-media
      PRODUCT_MEDIA_MAX_BYTES: ${PRODUCT_MEDIA_MAX_BYTES:-5242880}
      PRODUCT_MEDIA_SYNC_CRON: ${PRODUCT_MEDIA_SYNC_CRON:-30 3 * * *}
      PRODUCT_MEDIA_SYNC_CONCURRENCY: ${PRODUCT_MEDIA_SYNC_CONCURRENCY:-2}
      PRODUCT_MEDIA_VERIFY_OBJECTS: ${PRODUCT_MEDIA_VERIFY_OBJECTS:-true}
      PRODUCT_MEDIA_ALLOW_FAKE_GATEWAY: ${PRODUCT_MEDIA_ALLOW_FAKE_GATEWAY:-false}
      PRODUCT_MEDIA_SOURCE_FAILURE_LIMIT: ${PRODUCT_MEDIA_SOURCE_FAILURE_LIMIT:-3}
    volumes:
      - product_media:/var/lib/sales-force/product-media
    command: ["node", "dist/main-worker.js"]
    networks: [backend]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 4s
      start_period: 20s
      retries: 6

  # Internal identity verifier (STACK-2 option C). `disabled` (default) answers a uniform denial; `live` validates the
  # user's own Sankhya login against the Sankhya SANDBOX only (the process refuses any host that is not
  # `<account>-teste.sankhyacloud.com.br`, SNK-3) and returns only the normalized identity. Same image, own entry point,
  # own secret file. Not published, not on `edge`. By default it has NO route to the outside (internal-only network);
  # live mode needs VERIFIER_EGRESS_NETWORK=verifier_egress in compose.env (outbound-only network, nothing else attached).
  # No database, no worker Sankhya credentials: the process refuses to boot when it is given any.
  verifier:
    <<: *server
    restart: unless-stopped
    env_file:
      - ${SF_SECRETS_DIR}/verifier.env
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VERIFIER_MODE: ${VERIFIER_MODE:-disabled}
      VERIFIER_SANKHYA_BASE_URL: ${VERIFIER_SANKHYA_BASE_URL:-}
      # Container interface on the internal network; there is no published port and no other network.
      VERIFIER_HOST: 0.0.0.0
      VERIFIER_PORT: "3002"
    command: ["node", "dist/main-verifier.js"]
    networks: [verifier, "${VERIFIER_EGRESS_NETWORK:-verifier_noegress}"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 15s
      timeout: 4s
      start_period: 15s
      retries: 6

  # Static SPA behind the edge. Not published; its own /api proxy is bypassed (the edge routes /api/* directly
  # to the API so the API sees the real client address through a single trusted hop).
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE must be an explicit pinned image reference (tag or digest)}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # nginx-unprivileged runs as the nginx user; config.json is a symlink into /tmp (Dockerfile.web), the only
    # place written at start, so the root filesystem is read-only.
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    environment:
      INSTALLATION_NAME: ${INSTALLATION_NAME:-Force}
      # Brand files ship in the web image under /brand/ (apps/web/public/brand). Without these two the page falls back to
      # the neutral square initial. Logo: horizontal plate; mark: the round PLAC symbol 256x256 (favicon and header), the approved localhost brand (bacdb79).
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-/brand/plac-logo.png}
      BRAND_MARK_URL: ${BRAND_MARK_URL:-/brand/plac-mark-round.png}
      BRAND_ACCENT: ${BRAND_ACCENT:-}
      # Explicit, no default (the web container refuses to start without it). Staging value: `local`
      # (local login form only, no dev banner); must match API_AUTH_MODE.
      WEB_AUTH_MODE: ${WEB_AUTH_MODE:?WEB_AUTH_MODE must be set explicitly, staging value is local}
    networks: [edge]

  # TLS edge (OPS-3 PROPOSED: Caddy). Real HTTPS: automatic ACME certificates; storage in the caddy_data volume.
  edge:
    image: ${CADDY_IMAGE:?CADDY_IMAGE must be an explicit pinned image reference (tag or digest)}
    restart: unless-stopped
    logging: *logging
    <<: *hardening
    # Binds 80/443 (HTTP-01, HTTPS) and writes only to its two volumes, as root that owns them: the one capability
    # it needs is NET_BIND_SERVICE. The mounted Caddyfile must be world-readable (0644): root without
    # CAP_DAC_OVERRIDE cannot read a file owned by another user with a restrictive mode.
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy
    env_file:
      - ${SF_SECRETS_DIR}/edge.env
    environment:
      STAGING_DOMAIN: ${STAGING_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5

  # ---- Operations (profiles `ops`, `ops-admin`, `offsite`; run explicitly with `run --rm`, never started by `up`) ----

  # Logical dump of the staging database (custom format) into ${SF_BACKUP_DIR}. Uses the postgres client of the
  # SAME major as the server (PG_MAJOR). Connects as the READ-ONLY role force_backup (backup.env: pg_read_all_data,
  # no write, no DDL; db-roles.sql), never as the owner role. Runs as SF_OPS_USER, all capabilities dropped,
  # read-only root filesystem (it writes only to /backups).
  # With the self-hosted database it is the only recovery source; with a managed database it complements
  # provider PITR (OPS-2). Run it BEFORE every migration (README-staging.md "Build and deploy").
  backup:
    profiles: ["ops"]
    image: postgres:${PG_MAJOR:?PG_MAJOR must match production (DATA-1, V-15)}
    restart: "no"
    logging: *logging
    <<: *hardening
    user: ${SF_OPS_USER:?SF_OPS_USER must be the uid:gid that owns SF_BACKUP_DIR (the deploy user), e.g. 1001:1001}
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ${SF_SECRETS_DIR}/backup.env
    volumes:
      - ./staging/ops-lib.sh:/ops/ops-lib.sh:ro
      - ./staging/ops-backup.sh:/ops/ops-backup.sh:ro
      - ${SF_BACKUP_DIR:?SF_BACKUP_DIR must be a host directory outside the repository}:/backups
    networks: [backend]
    entrypoint: ["sh", "/ops/ops-backup.sh"]

  # Pre-migration safety net as ONE command: `run --rm migrate-safe` first runs `backup` (a failing dump stops
  # here, nothing is migrated), then the same one-shot migration as `migrate`. The deploy runbook uses it; the
  # first deploy (no database yet) uses plain `migrate`. Needs the database up (profile self-hosted-db).
  migrate-safe:
    <<: *migrate
    profiles: ["ops"]
    depends_on:
      backup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
        required: false

  # Restore test: restores the newest dump into a SCRATCH database (RESTORE_TEST_DATABASE_URL, from
  # restore-test.env) and runs sanity checks. Refuses to run when the target is, or resolves to, the live
  # database (parsed names, restore/test/scratch marker, and the server identity of both connections).
  # The live side is read with force_backup (backup.env, read-only); the restore itself writes ONLY with the
  # restore-test.env credential (a role that owns the scratch database, usually on another server, with no access
  # to the live one; the scratch database is created once by the administrator, never by this job). /backups is
  # writable only so that a successful run can write <dump>.restore-ok (the optional off-site gate); the script
  # never modifies a dump.
  restore-check:
    profiles: ["ops"]
    image: postgres:${PG_MAJOR:?PG_MAJOR must match production (DATA-1, V-15)}
    restart: "no"
    logging: *logging
    <<: *hardening
    user: ${SF_OPS_USER:?SF_OPS_USER must be the uid:gid that owns SF_BACKUP_DIR (the deploy user), e.g. 1001:1001}
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ${SF_SECRETS_DIR}/backup.env
      - ${SF_SECRETS_DIR}/restore-test.env
    volumes:
      - ./staging/ops-lib.sh:/ops/ops-lib.sh:ro
      - ./staging/ops-restore-check.sh:/ops/ops-restore-check.sh:ro
      - ${SF_BACKUP_DIR}:/backups
    networks: [backend]
    entrypoint: ["sh", "/ops/ops-restore-check.sh"]

  # Off-VPS copy (second failure domain): uploads the newest VERIFIED dump and its .sha256 to an S3-compatible
  # bucket, optionally encrypted client-side with an age public key, and verifies the stored copy. The image is
  # built from deploy/staging/Dockerfile.offsite (aws-cli + age on a pinned Alpine, OFFSITE_BASE_IMAGE); a
  # prebuilt, pinned image can replace it through OFFSITE_IMAGE. Needs outbound internet only (network `egress`),
  # no database access and no other secret than offsite.env. The bucket and credentials are PENDING
  # infrastructure: nothing here names a real location.
  offsite:
    profiles: ["offsite"]
    image: ${OFFSITE_IMAGE:?OFFSITE_IMAGE must be an explicit pinned image reference (tag or digest)}
    build:
      context: ./staging
      dockerfile: Dockerfile.offsite
      args:
        BASE_IMAGE: ${OFFSITE_BASE_IMAGE:?OFFSITE_BASE_IMAGE must be an explicit pinned image reference (tag or digest)}
    restart: "no"
    logging: *logging
    <<: *hardening
    read_only: true
    # Small on purpose: the dump is never staged locally (ops-offsite-sync.sh streams it); only checksums and
    # FIFOs live here. Runs as SF_OPS_USER to read the 0600 dumps without CAP_DAC_OVERRIDE.
    user: ${SF_OPS_USER:?SF_OPS_USER must be the uid:gid that owns SF_BACKUP_DIR (the deploy user), e.g. 1001:1001}
    tmpfs:
      - /tmp:size=16m
    environment:
      HOME: /tmp
    env_file:
      - ${SF_SECRETS_DIR}/offsite.env
    volumes:
      - ./staging/ops-offsite-sync.sh:/ops/ops-offsite-sync.sh:ro
      - ${SF_BACKUP_DIR}:/backups:ro
    networks: [egress]
    entrypoint: ["sh", "/ops/ops-offsite-sync.sh"]

  # One-time bootstrap of the least-privilege roles (force_api, force_worker, force_migrator, force_backup), run BY THE OWNER as
  # the database administrator (db-admin.env, outside the repository), after the database exists and BEFORE the
  # first `migrate`. Idempotent. Passwords come from db-admin.env through a tmpfs preamble, never from this file
  # nor the process arguments. Profile `ops-admin` is separate from `ops` so that routine backup/restore runs
  # can never pull the administrator credential in.
  db-roles:
    profiles: ["ops-admin"]
    image: postgres:${PG_MAJOR:?PG_MAJOR must match production (DATA-1, V-15)}
    restart: "no"
    logging: *logging
    <<: *hardening
    user: ${SF_OPS_USER:?SF_OPS_USER must be the uid:gid that owns SF_BACKUP_DIR (the deploy user), e.g. 1001:1001}
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ${SF_SECRETS_DIR}/db-admin.env
    volumes:
      - ./staging/ops-db-roles.sh:/ops/ops-db-roles.sh:ro
      - ./staging/db-roles.sql:/ops/db-roles.sql:ro
    networks: [backend]
    entrypoint: ["sh", "/ops/ops-db-roles.sh"]

networks:
  # Private: the database (container or managed) and the processes that talk to it.
  backend: {}
  # Edge <-> web/api only.
  edge: {}
  # API <-> verifier only. `internal`: no published ports and no route to the outside (STACK-2 option C).
  verifier:
    internal: true
  # Verifier-only. Default attachment of the verifier: no route out (internal).
  verifier_noegress:
    internal: true
  # Verifier-only outbound path for the live Sankhya SANDBOX login (selected with VERIFIER_EGRESS_NETWORK).
  verifier_egress: {}
  # Outbound-only network of the off-site copy job (no other service is attached).
  egress: {}

volumes:
  pgdata:
  # Product photos (INTERIM filesystem object store). Persistent, included in the host/volume backup scope;
  # never part of an image or of the repository. Replaced by S3-compatible storage once V-05 closes.
  product_media:
  caddy_data:
  caddy_config:
