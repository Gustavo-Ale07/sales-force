<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Force PLAC: catálogo, pedidos e clientes em um só lugar." />
    <meta name="theme-color" content="#1e2b8f" />
    <!-- Default favicon: the official PLAC mark. brand.markUrl from /config.json replaces it at runtime. -->
    <link rel="icon" type="image/png" href="/brand/plac-mark.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Force PLAC</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot screen: shown until the app mounts and replaces #root's content. Styled from the bundled stylesheet (the CSP forbids inline styles). -->
      <div class="sf-boot" role="status" aria-live="polite">
        <span class="sf-boot__mark" aria-hidden="true"></span>
        <p class="sf-boot__text">Carregando o Sales Force…</p>
        <span class="sf-boot__bar" aria-hidden="true"></span>
      </div>
    </div>
    <noscript>Este aplicativo precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
