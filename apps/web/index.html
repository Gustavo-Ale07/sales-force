<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Force PLAC: catálogo, pedidos e clientes em um só lugar." />
    <meta name="theme-color" content="#1e2b8f" />
    <!-- Default favicons: the round P symbol (transparent corners). brand.markUrl from /config.json replaces the icon at runtime. apple-touch-icon is square on purpose (iOS rounds it). /brand/* is revalidated by the browser (nginx: no-cache). -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Force PLAC</title>
  </head>
  <body>
    <div id="root">
      <!-- Boot screen: shown until the app mounts and replaces #root's content. Styled from the bundled stylesheet (the CSP forbids inline styles). -->
      <div class="sf-boot" role="status" aria-live="polite">
        <span class="sf-boot__mark" aria-hidden="true"></span>
        <p class="sf-boot__text">Carregando o Force PLAC…</p>
        <span class="sf-boot__bar" aria-hidden="true"></span>
      </div>
    </div>
    <noscript>Este aplicativo precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
